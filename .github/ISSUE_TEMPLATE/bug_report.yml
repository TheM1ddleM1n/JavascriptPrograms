name: Bug Report
description: Something not working right here..
labels: "bug"
assignees: "TheM1ddleM1n"
body:
  - type: input
    attributes:
      label: Which file?
      description: The name of the file that has the bug.
      placeholder: Hangman.js
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How do we make the bug happen?
      placeholder: |
        1. Run `node hangman.js`
        2. Type a letter
        3. Saw a error appear
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: |
        The letter should be revealed in the word.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        The game crashed with a TypeError.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error Output
      description: Paste any error messages from your terminal or the browser console here.
  - type: input
    attributes:
      label: Environment
      description: Your OS and Node version (run `node -v`) or browser if relevant.
      placeholder: ie. Windows 11, Node v26.1.0
  - type: textarea
    attributes:
      label: Additional Information
      description: "Anything else that might help. Pro tip: 'please fix this bug' will NOT help."
