name: I would like to contribute!
description: Let me know you're working on something before you open a PR
labels: "contribution"
assignees: "TheM1ddleM1n"
body:
  - type: input
    attributes:
      label: What are you adding?
      description: I cannot mind read so tell me a short description of your chosen program.
      placeholder: Caesar cipher utility
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: Optional notes, questions, or a draft of your idea.
