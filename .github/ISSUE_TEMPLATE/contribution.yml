name: I Want to Contribute
description: Let us know you're working on something before you open a PR
labels: "contribution"
assignees: "TheM1ddleM1n"
body:
  - type: input
    attributes:
      label: What are you adding?
      description: A short name or description of your program.
      placeholder: Caesar cipher utility
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: Optional notes, questions, or a draft of your idea.
